name: ci
on: [push, pull_request]

# 最小权限：CI 只读（显式声明，不依赖仓库默认值）
permissions:
  contents: read

jobs:
  build:
    name: build & test (${{ matrix.os }})
    # Cross-platform gate: build, vet and the real tests run on all three operating systems.
    # The runner collects targets with filepath.Glob and shells out to the interpreter, so its
    # behaviour is genuinely platform dependent and a Linux-only runner proves too little.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5（SHA 固定；dependabot 周更）
        with:
          go-version: '1.26'
      # bash on every OS: the runner's default shell is pwsh on Windows, where a bare multi-line
      # script only reports the exit code of its last command and would swallow a failing build.
      - name: Build, vet and test
        shell: bash
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1
